<?xml version="1.0" encoding="UTF-8"?>
<!--
  Structure commune à tous les badges (harmonisée le stage 2026) :
  1. fond pilule SOMBRE UNIFORME (plus de couleur de marque en fond, juste un léger
     reflet qui glisse) — pour que les 10 badges cohabitent sans clash de couleurs
  2. anneaux fixes + 3 "boules" (électrons) indépendantes, dans la couleur de marque
     (accent), chacune sur sa propre orbite, décalées dans le temps
  3. dégradé radial adouci (moins de blanc pur) sur le noyau + les boules
-->
<svg xmlns="http://www.w3.org/2000/svg" width="61" height="34" viewBox="0 0 61 34" role="img" aria-label="PHP">
  <title>PHP</title>
  <defs>
    <linearGradient id="g_php" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="45%" stop-color="#2e2e2e"/>
      <stop offset="55%" stop-color="#2e2e2e"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1 0" to="1 0" dur="2.00s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="sphere_php" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#cab9fc"/>
      <stop offset="45%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#4b3e70"/>
    </radialGradient>
  </defs>

  <rect width="61" height="34" rx="17" fill="url(#g_php)"/>

  <defs>
    <path id="orb1_php" d="M19,13.6 a9,3.4 0 1,0 0.1,0"/>
    <path id="orb2_php" d="M19,13.6 a9,3.4 0 1,0 0.1,0" transform="rotate(60 19 17)"/>
    <path id="orb3_php" d="M19,13.6 a9,3.4 0 1,0 0.1,0" transform="rotate(120 19 17)"/>
  </defs>

  <g fill="none" stroke="#A78BFA" stroke-width="1.1" opacity="0.6">
    <ellipse cx="19" cy="17" rx="9" ry="3.4"/>
    <ellipse cx="19" cy="17" rx="9" ry="3.4" transform="rotate(60 19 17)"/>
    <ellipse cx="19" cy="17" rx="9" ry="3.4" transform="rotate(120 19 17)"/>
  </g>
  <circle cx="19" cy="17" r="2" fill="url(#sphere_php)"/>
  <circle r="1.6" fill="url(#sphere_php)">
    <animateMotion dur="2.4s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orb1_php"/>
    </animateMotion>
  </circle>
  <circle r="1.6" fill="url(#sphere_php)">
    <animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orb2_php"/>
    </animateMotion>
  </circle>
  <circle r="1.6" fill="url(#sphere_php)">
    <animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orb3_php"/>
    </animateMotion>
  </circle>

  <text x="46" y="22" font-size="12.5"
    font-family="Verdana,DejaVu Sans,Geneva,sans-serif" fill="#A78BFA"
    text-anchor="middle" font-weight="bold">PHP</text>
</svg>
