<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="132" height="34" viewBox="0 0 132 34" role="img" aria-label="JavaScript">
  <title>JavaScript</title>
  <defs>
    <linearGradient id="g_javascript" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7DF1E"/>
      <stop offset="45%" stop-color="#faed83"/>
      <stop offset="55%" stop-color="#faed83"/>
      <stop offset="100%" stop-color="#F7DF1E"/>
