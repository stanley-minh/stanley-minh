    <ellipse rx="9" ry="3.4" fill="none" stroke="#000" stroke-width="1.1" opacity="0.85" transform="rotate(60)"/>
    <ellipse rx="9" ry="3.4" fill="none" stroke="#000" stroke-width="1.1" opacity="0.85" transform="rotate(120)"/>
    <circle r="2" fill="#000"/>
