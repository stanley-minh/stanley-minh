<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="174" height="34" viewBox="0 0 174 34" role="img" aria-label="GitHub Actions — en cours">
  <title>GitHub Actions — en cours d'apprentissage</title>
  <rect x="1.5" y="1.5" width="171" height="31" rx="16" fill="#0d1117"
    stroke="#2088FF" stroke-width="1.6" stroke-dasharray="7 6" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="20" cy="17" r="4.5" fill="#2088FF">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4.5;6.5;4.5" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <text x="101" y="21.5" font-size="12"
    font-family="Verdana,DejaVu Sans,Geneva,sans-serif" fill="#2088FF"
    text-anchor="middle" font-weight="bold">GitHub Actions</text>
</svg>
