<?xml version="1.0" encoding="UTF-8"?>
<!--
  Structure commune à tous les badges (harmonisée le stage 2026) :
  1. fond pilule avec reflet qui glisse (technique reprise de l'ancien javascript.svg)
  2. anneaux fixes + 3 "boules" (électrons) indépendantes, chacune sur sa propre orbite,
     décalées dans le temps (begin) — comme l'atome React d'origine, adapté en petit format
  3. dégradé radial sur le noyau + les boules pour un effet sphère
-->
<svg xmlns="http://www.w3.org/2000/svg" width="91" height="34" viewBox="0 0 91 34" role="img" aria-label="Symfony">
  <title>Symfony</title>
  <defs>
    <linearGradient id="g_symfony" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="45%" stop-color="#4d4d4d"/>
      <stop offset="55%" stop-color="#4d4d4d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1 0" to="1 0" dur="2.00s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="sphere_symfony" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4d4d4d"/>
      <stop offset="45%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </radialGradient>
  </defs>

  <rect width="91" height="34" rx="17" fill="url(#g_symfony)"/>

  <defs>
    <path id="orb1_symfony" d="M19,13.6 a9,3.4 0 1,0 0.1,0"/>
    <path id="orb2_symfony" d="M19,13.6 a9,3.4 0 1,0 0.1,0" transform="rotate(60 19 17)"/>
    <path id="orb3_symfony" d="M19,13.6 a9,3.4 0 1,0 0.1,0" transform="rotate(120 19 17)"/>
  </defs>

  <g fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.55">
    <ellipse cx="19" cy="17" rx="9" ry="3.4"/>
    <ellipse cx="19" cy="17" rx="9" ry="3.4" transform="rotate(60 19 17)"/>
    <ellipse cx="19" cy="17" rx="9" ry="3.4" transform="rotate(120 19 17)"/>
  </g>
  <circle cx="19" cy="17" r="2" fill="url(#sphere_symfony)"/>
  <circle r="1.6" fill="url(#sphere_symfony)">
    <animateMotion dur="2.4s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orb1_symfony"/>
    </animateMotion>
  </circle>
  <circle r="1.6" fill="url(#sphere_symfony)">
    <animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orb2_symfony"/>
    </animateMotion>
  </circle>
  <circle r="1.6" fill="url(#sphere_symfony)">
    <animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orb3_symfony"/>
    </animateMotion>
  </circle>

  <text x="62" y="22" font-size="12.5"
    font-family="Verdana,DejaVu Sans,Geneva,sans-serif" fill="#ffffff"
    text-anchor="middle" font-weight="bold">Symfony</text>
</svg>
