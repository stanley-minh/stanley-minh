<?xml version="1.0" encoding="UTF-8"?>
<!--
  Structure commune à tous les badges (harmonisée le stage 2026) :
  1. fond pilule avec reflet qui glisse (technique reprise de l'ancien javascript.svg)
  2. icône "atome" qui tourne en bloc rigide via animateTransform (même technique que javascript.svg,
     appliquée ici aussi à react-atom.svg qui utilisait avant un système différent : électrons
     indépendants sur animateMotion/mpath)
  3. dégradé radial sur le noyau + les électrons pour un effet sphère (technique testée sur react-atom.svg)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="84" height="34" viewBox="0 0 84 34" role="img" aria-label="NestJS">
  <title>NestJS</title>
  <defs>
    <linearGradient id="g_nestjs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0234E"/>
      <stop offset="45%" stop-color="#f28aa1"/>
      <stop offset="55%" stop-color="#f28aa1"/>
      <stop offset="100%" stop-color="#E0234E"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1 0" to="1 0" dur="2.00s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="sphere_nestjs" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f28aa1"/>
      <stop offset="45%" stop-color="#E0234E"/>
      <stop offset="100%" stop-color="#7b132a"/>
    </radialGradient>
  </defs>

  <rect width="84" height="34" rx="17" fill="url(#g_nestjs)"/>

  <g transform="translate(19 17)">
    <g fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.55">
      <ellipse rx="9" ry="3.4"/>
      <ellipse rx="9" ry="3.4" transform="rotate(60)"/>
      <ellipse rx="9" ry="3.4" transform="rotate(120)"/>
    </g>
    <circle cx="9" cy="0" r="1.7" fill="url(#sphere_nestjs)"/>
    <circle cx="4.5" cy="7.8" r="1.7" fill="url(#sphere_nestjs)" transform="rotate(60)"/>
    <circle cx="-4.5" cy="7.8" r="1.7" fill="url(#sphere_nestjs)" transform="rotate(120)"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      from="0" to="360" dur="7s" repeatCount="indefinite"/>
  </g>
  <circle cx="19" cy="17" r="2" fill="url(#sphere_nestjs)"/>

  <text x="58" y="22" font-size="12.5"
    font-family="Verdana,DejaVu Sans,Geneva,sans-serif" fill="#ffffff"
    text-anchor="middle" font-weight="bold">NestJS</text>
</svg>
