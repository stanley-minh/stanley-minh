<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icône du header "Hey there" — alignée sur le style des badges du Stack :
  3 électrons indépendants, même vitesse, décalés dans le temps (begin), chacun sur
  sa propre orbite. Dégradé sphère conservé sur le noyau et les électrons.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="120" height="120" viewBox="0 0 100 100" role="img" aria-label="React" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>React</title>
  <defs>
    <path id="orb1" d="M50,34 a42,16 0 1,0 0.1,0"/>
    <path id="orb2" d="M50,34 a42,16 0 1,0 0.1,0" transform="rotate(60 50 50)"/>
    <path id="orb3" d="M50,34 a42,16 0 1,0 0.1,0" transform="rotate(120 50 50)"/>
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e6fbff"/>
      <stop offset="45%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#1c93b8"/>
    </radialGradient>
  </defs>

  <g fill="none" stroke="#61DAFB" stroke-width="2.6" opacity="0.55">
    <use href="#orb1" xlink:href="#orb1"/>
    <use href="#orb2" xlink:href="#orb2"/>
    <use href="#orb3" xlink:href="#orb3"/>
  </g>

  <circle cx="50" cy="50" r="7.5" fill="url(#sphereGrad)"/>

  <circle r="4.5" fill="url(#sphereGrad)">
    <animateMotion dur="2.4s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orb1" xlink:href="#orb1"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="url(#sphereGrad)">
    <animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orb2" xlink:href="#orb2"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="url(#sphereGrad)">
    <animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orb3" xlink:href="#orb3"/>
    </animateMotion>
  </circle>
</svg>
