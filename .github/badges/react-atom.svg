<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="120" height="120" viewBox="0 0 100 100" role="img" aria-label="React">
  <title>React</title>
  <defs>
    <path id="orb1" d="M50,34 a42,16 0 1,0 0.1,0"/>
    <path id="orb2" d="M50,34 a42,16 0 1,0 0.1,0" transform="rotate(60 50 50)"/>
    <path id="orb3" d="M50,34 a42,16 0 1,0 0.1,0" transform="rotate(120 50 50)"/>
  </defs>

  <g fill="none" stroke="#61DAFB" stroke-width="2.6" opacity="0.55">
    <use href="#orb1" xlink:href="#orb1"/>
    <use href="#orb2" xlink:href="#orb2"/>
    <use href="#orb3" xlink:href="#orb3"/>
  </g>

  <circle cx="50" cy="50" r="7.5" fill="#61DAFB"/>

  <circle r="4.5" fill="#61DAFB">
    <animateMotion dur="3s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orb1" xlink:href="#orb1"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#61DAFB">
    <animateMotion dur="3s" begin="-1s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orb2" xlink:href="#orb2"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#61DAFB">
    <animateMotion dur="3s" begin="-2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orb3" xlink:href="#orb3"/>
    </animateMotion>
  </circle>
</svg>
