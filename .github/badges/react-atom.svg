<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icône seule du header "Hey there" — harmonisée avec le style des badges pilule :
  rotation rigide en bloc (animateTransform), plus dégradé sphère sur le noyau/électrons.
  Avant : électrons indépendants sur animateMotion + mpath (asynchrones).
-->
<svg xmlns="http://www.w3.org/2000/svg"
  width="120" height="120" viewBox="0 0 100 100" role="img" aria-label="React">
  <title>React</title>
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e6fbff"/>
      <stop offset="45%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#1c93b8"/>
    </radialGradient>
  </defs>

  <g transform="translate(50 50)">
    <g fill="none" stroke="#61DAFB" stroke-width="1.1" opacity="0.55">
      <ellipse rx="42" ry="16"/>
      <ellipse rx="42" ry="16" transform="rotate(60)"/>
      <ellipse rx="42" ry="16" transform="rotate(120)"/>
    </g>
    <circle cx="42" cy="0" r="4" fill="url(#sphereGrad)"/>
    <circle cx="21" cy="36.4" r="4" fill="url(#sphereGrad)" transform="rotate(60)"/>
    <circle cx="-21" cy="36.4" r="4" fill="url(#sphereGrad)" transform="rotate(120)"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      from="0" to="360" dur="7s" repeatCount="indefinite"/>
  </g>

  <circle cx="50" cy="50" r="7.5" fill="url(#sphereGrad)"/>
</svg>
