<svg xmlns="http://www.w3.org/2000/svg" width="146" height="34" viewBox="0 0 146 34" role="img" aria-label="GitHub Actions">
  <title>GitHub Actions</title>
  <!-- Généré par scripts/build-badges.mjs : modifier le script, pas ce fichier. -->
  <style>
    .shine { animation: shine 7s ease-in-out 2.0s infinite; }
    @keyframes shine { 0% { transform: translateX(156px); } 35%, 100% { transform: translateX(-40px); } }
    /* Rotation autour du centre du lotus. Décalage négatif propre à chaque badge : ils ne tournent pas en chœur. */
    .ring-out, .ring-in { transform-box: fill-box; transform-origin: center; }
    .ring-out { animation: spin 14s linear -6.8s infinite reverse; }
    .ring-in { animation: spin 9s linear -4.4s infinite normal; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .shine { animation: none; opacity: 0; }
      .ring-out, .ring-in { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="pill"><rect width="146" height="34" rx="17"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e44"/><stop offset="1" stop-color="#24272b"/>
    </linearGradient>
    <!-- Biseau : un reflet clair sur la moitié haute donne le volume « bombé » de la pilule. -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3cc" stop-opacity="0"/><stop offset="0.5" stop-color="#fff3cc" stop-opacity="0.35"/><stop offset="1" stop-color="#fff3cc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="petal-outer" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#831843"/><stop offset="0.55" stop-color="#db2777"/><stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="petal-inner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0c4a6e"/><stop offset="0.55" stop-color="#0284c7"/><stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="seed" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff3cc"/><stop offset="0.45" stop-color="#ffd873"/><stop offset="1" stop-color="#f2b01e"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0.6" dy="1.2" stdDeviation="0.9" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <path id="outer" d="M0,-2 C-3.3,-5 -3.5,-10 0,-13.5 C3.5,-10 3.3,-5 0,-2 Z"/>
    <path id="inner" d="M0,-1 C-2.4,-3.5 -2.6,-7.5 0,-10 C2.6,-7.5 2.4,-3.5 0,-1 Z"/>
  </defs>

  <g clip-path="url(#pill)">
    <rect width="146" height="34" fill="url(#bg)"/>
    <rect width="146" height="17" fill="url(#bevel)"/>
    <rect class="shine" x="0" y="0" width="34" height="34" fill="url(#shine-band)" transform="skewX(-20)"/>
  </g>
  <rect x="0.5" y="0.5" width="145" height="33" rx="16.5" fill="none" stroke="#7dd3fc" stroke-opacity="0.55"/>

  <g transform="translate(19 17) scale(0.95)" filter="url(#drop)">
    <g class="ring-out" fill="url(#petal-outer)" stroke="#fce7f3" stroke-width="0.7"><use href="#outer" transform="rotate(0)"/><use href="#outer" transform="rotate(45)"/><use href="#outer" transform="rotate(90)"/><use href="#outer" transform="rotate(135)"/><use href="#outer" transform="rotate(180)"/><use href="#outer" transform="rotate(225)"/><use href="#outer" transform="rotate(270)"/><use href="#outer" transform="rotate(315)"/></g>
    <g filter="url(#lift)"><g class="ring-in" fill="url(#petal-inner)" stroke="#0c4a6e" stroke-width="0.7"><use href="#inner" transform="rotate(22.5)"/><use href="#inner" transform="rotate(67.5)"/><use href="#inner" transform="rotate(112.5)"/><use href="#inner" transform="rotate(157.5)"/><use href="#inner" transform="rotate(202.5)"/><use href="#inner" transform="rotate(247.5)"/><use href="#inner" transform="rotate(292.5)"/><use href="#inner" transform="rotate(337.5)"/></g></g>
    <g filter="url(#lift)">
      <circle r="3.4" fill="url(#seed)" stroke="#c08a2e" stroke-width="0.7"/>
      <g fill="#c08a2e"><circle r="0.6"/><circle cx="1.7" r="0.6"/><circle cx="-1.7" r="0.6"/><circle cy="1.7" r="0.6"/><circle cy="-1.7" r="0.6"/></g>
    </g>
  </g>

  <text x="37" y="21.5" textLength="95" lengthAdjust="spacing" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#e0f2fe">GitHub Actions</text>
</svg>
